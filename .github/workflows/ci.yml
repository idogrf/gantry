name: CI
on:
  # Pull requests only, no run on a plain push. Whether a pull request from a fork runs by itself or waits for the
  # maintainer's approval is a repository setting (Settings → Actions → General → Fork pull request workflows).
  pull_request:
  # macOS and Windows run only from here (Actions → CI → Run workflow): their minutes cost 10× and 2×.
  workflow_dispatch:
    inputs:
      linux:
        description: Also run Linux (fmt, deny, tests)
        type: boolean
        default: true
      smoke:
        description: "macOS/Windows: start Gantry after the tests, screenshot it, upload as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Line numbers in backtraces but no full debug info: linking the GPUI test binaries is most of the build time.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["ubuntu-24.04"]') || inputs.linux && fromJSON('["ubuntu-24.04", "macos-15", "windows-2025"]') || fromJSON('["macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    # A cold build (no cache) takes about 30 min on Linux; a hang must not run for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libzstd-dev
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep the built dependencies even when clippy or a test fails (first macOS/Windows runs).
          cache-on-failure: true
          # A key is saved only once. Windows' first save held only clippy's build, so its key is new (v1); bump it
          # again if a cache ever stays partial (a step that rebuilds the dependencies on every run).
          prefix-key: ${{ runner.os == 'Windows' && 'v1-rust' || 'v0-rust' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every crate's failures in one run, not just the first crate's.
      - run: cargo test --workspace --no-fail-fast
      # Smoke run: does the app start and draw? A plain shell tab (no Claude), its own profile, 20 s, one screenshot.
      - name: Smoke run (macOS)
        if: inputs.smoke && runner.os == 'macOS'
        env:
          GANTRY_PROFILE: smoke
          RUST_LOG: info
        run: |
          cargo build -p gantry
          mkdir -p smoke
          ./target/debug/gantry > smoke/gantry.log 2>&1 &
          sleep 20
          screencapture -x smoke/screen.png || echo "screencapture failed" >> smoke/gantry.log
          alive=0; pgrep -f "target/debug/gantry$" > /dev/null && alive=1
          find ~/Library -path '*gantry*' -name 'daemon.log*' -exec cp {} smoke/ \; || true
          pkill -f target/debug/gantry || true
          test "$alive" = 1 || { echo "Gantry exited within 20 s"; cat smoke/gantry.log; exit 1; }
      - name: Smoke run (Windows)
        if: inputs.smoke && runner.os == 'Windows'
        shell: pwsh
        env:
          GANTRY_PROFILE: smoke
          RUST_LOG: info
        run: |
          cargo build -p gantry
          New-Item -ItemType Directory -Force smoke | Out-Null
          $app = Start-Process target\debug\gantry.exe -PassThru -RedirectStandardOutput smoke\gantry.log -RedirectStandardError smoke\gantry.err
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save((Join-Path $PWD "smoke\screen.png"))
          $alive = -not $app.HasExited
          Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Recurse -Filter 'daemon.log*' -ErrorAction SilentlyContinue | Copy-Item -Destination smoke
          Get-Process gantry -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { Write-Output "Gantry exited within 20 s"; Get-Content smoke\gantry.log, smoke\gantry.err; exit 1 }
      - name: Upload the smoke run
        if: always() && inputs.smoke && runner.os != 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
          if-no-files-found: ignore

  deny:
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses sources advisories
