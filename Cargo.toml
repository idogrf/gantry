[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.10.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["font-kit", "wayland", "x11"] }
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
async-channel = "2.5"
anyhow = "1"
regex = "1"
unicode-bidi = "0.3.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
app-core = { path = "crates/app-core" }
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time"] }
interprocess = { version = "2.4", features = ["tokio"] }
directories = "6"
tracing-appender = "0.2"
daemon = { path = "crates/daemon" }
ui-gpui = { path = "crates/ui-gpui" }
claude-index = { path = "crates/claude-index" }
notify = "8.2"
nucleo-matcher = "0.3.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
notify-rust = "4.18"
rodio = { version = "0.22", default-features = false, features = ["playback", "wav"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tantivy = { version = "0.26", default-features = false, features = ["mmap", "stemmer", "lz4-compression"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# Zed builds GPUI against these patched crates; mirror them so GPUI runs as it does in Zed.
# Revisions copied from Zed's Cargo.lock at the pinned rev.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }

# Unoptimized GPUI renders slowly enough to mislead manual testing of the terminal.
[profile.dev.package."*"]
opt-level = 2

# Debug info stays out of the shipped binary; symbol names stay for backtraces.
[profile.release]
strip = "debuginfo"
