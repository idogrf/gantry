[advisories]
version = 2
# Fail only on unmaintained crates we depend on directly; transitive ones (e.g. via GPUI) can't be
# replaced from here. Vulnerability advisories still fail for every crate.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
private = { ignore = true }

# comrak's grapheme tables; Unicode-DFS-2016 is permissive (predecessor of Unicode-3.0).
[[licenses.exceptions]]
name = "finl_unicode"
allow = ["Unicode-DFS-2016"]

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/wasm_thread",
]
