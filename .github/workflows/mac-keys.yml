name: macOS keys
# By hand only (macOS minutes cost 10x). An experiment: does a real Cmd+Left / Cmd+Right reach a Gantry pane on macOS?
on:
  workflow_dispatch:
  # TEMPORARY: remove before the PR; a hand-started workflow needs its file on the default branch first.
  push:
    branches: [feat/mac-line-keys]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  keys:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          prefix-key: v0-rust
      - run: cargo build -p gantry
      - name: Press Cmd+Left / Cmd+Right
        run: bash scripts/mac-keys-check.sh"$PWD/target/debug/gantry" "$RUNNER_TEMP/keys"
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-keys
          path: ${{ runner.temp }}/keys/
